<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Urwort Graph Viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="viewer.css">
</head>
<body>
<header class="top">
  <a class="brand" href="#/">Urwort <span>Graph Viewer</span></a>
  <div class="search">
    <input id="q" type="search" placeholder="Search any German word…" autocomplete="off" spellcheck="false" aria-label="Search a word" aria-controls="sugg" aria-expanded="false">
    <ul id="sugg" role="listbox" hidden></ul>
  </div>
  <nav class="tabs" aria-label="Sections">
    <a href="#/" data-tab="overview">Overview</a>
    <a href="#/queues" data-tab="queues">Queues</a>
    <a href="#/review" data-tab="review">Review <span id="rc" class="count">0</span></a>
  </nav>
</header>
<main id="view" aria-live="polite"><p class="muted">Loading…</p></main>
<audio id="player" preload="none"></audio>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="app.js"></script>
</body>
</html>
